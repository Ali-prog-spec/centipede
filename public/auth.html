<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centipede Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-panel {
      width: 100%;
      max-width: 430px;
      background: var(--surface-2);
      border: 3px solid var(--green);
      border-radius: var(--radius);
      padding: 40px;
      box-shadow: 0 0 20px var(--glow);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .auth-logo {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .auth-title {
      font-family: var(--font-pixel);
      font-size: 18px;
      color: var(--green);
      text-shadow: 0 0 10px var(--green);
      margin-bottom: 5px;
    }

    .auth-subtitle {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--green-dim);
      letter-spacing: 2px;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      font-family: var(--font-pixel);
      font-size: 10px;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-input {
      background: var(--bg);
      border: 2px solid var(--green);
      color: var(--green);
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .form-input:focus {
      box-shadow: 0 0 10px var(--glow);
      background: rgba(0, 255, 65, 0.05);
    }

    .auth-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--green);
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: none;
      color: var(--green-dim);
      font-family: var(--font-pixel);
      font-size: 10px;
      text-transform: uppercase;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      letter-spacing: 1px;
    }

    .tab-btn.active {
      color: var(--green);
      border-bottom-color: var(--green);
      text-shadow: 0 0 8px var(--green);
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .submit-btn {
      padding: 14px;
      background: linear-gradient(135deg, var(--green), var(--green-dim));
      border: 2px solid var(--green);
      color: var(--bg);
      font-family: var(--font-pixel);
      font-size: 12px;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 0 10px var(--glow-sm);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px var(--glow);
    }

    .error-message,
    .success-message {
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      display: none;
    }

    .error-message {
      background: rgba(255, 51, 51, 0.1);
      border-left: 3px solid var(--red);
      color: var(--red);
    }

    .success-message {
      background: rgba(0, 255, 65, 0.1);
      border-left: 3px solid var(--green);
      color: var(--green);
    }

    .error-message.show,
    .success-message.show {
      display: block;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .info-text {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      margin-top: 20px;
      line-height: 1.6;
    }

    .coins-display {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--surface-2);
      border: 2px solid var(--amber);
      padding: 12px 20px;
      border-radius: var(--radius);
      font-family: var(--font-pixel);
      font-size: 12px;
      color: var(--amber);
      display: none;
    }

    .coins-display.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="bg-floating-logo">🐛</div>
  <div class="scanlines"></div>

  <div class="coins-display" id="coinsDisplay">
    TOKENS: <span id="coinCount">3</span>
  </div>

  <div class="auth-container">
    <div class="auth-panel">
      <div class="auth-header">
        <div class="auth-logo">🐛</div>
        <h1 class="auth-title">CENTIPEDE</h1>
        <p class="auth-subtitle">ARCADE ACCESS</p>
      </div>

      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>

      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">LOGIN</button>
        <button class="tab-btn" data-tab="signup">SIGNUP</button>
      </div>

      <form class="auth-form" id="authForm">
        <div id="login-form" class="form-section active">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" class="form-input" id="login-username" autocomplete="username" minlength="2" maxlength="20" />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" id="login-password" autocomplete="current-password" minlength="4" />
          </div>
          <button type="button" class="submit-btn" id="loginBtn">LOGIN</button>
        </div>

        <div id="signup-form" class="form-section">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" class="form-input" id="signup-username" autocomplete="username" minlength="2" maxlength="20" />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" id="signup-password" autocomplete="new-password" minlength="4" />
          </div>
          <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-input" id="signup-confirm" autocomplete="new-password" minlength="4" />
          </div>
          <div class="form-group">
            <label class="form-label">I Am Signing Up As</label>
            <select class="form-input" id="signup-role">
              <option value="player">Player</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <button type="button" class="submit-btn" id="signupBtn">CREATE ACCOUNT</button>
        </div>
      </form>

      <p class="info-text">
        Players use tokens to play and to buy shooter skins.<br />
        Admins can search players, view history, and assign tokens.
      </p>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-section">
        <span class="footer-label">&copy; CENTIPEDE ARCADE</span>
        <span class="footer-text">All Rights Reserved 2026</span>
      </div>
      <div class="footer-section">
        <span class="footer-label">LINKS</span>
        <a href="/about.html" class="footer-contact">About Game</a>
      </div>
      <div class="footer-section">
        <span class="footer-label">SOCIAL</span>
        <a href="https://www.instagram.com/cursevuv/" target="_blank" rel="noopener noreferrer" class="footer-contact">Instagram</a>
      </div>
      <div class="footer-section">
        <span class="footer-label">SUPPORT</span>
        <a href="https://wa.me/923117732344" target="_blank" rel="noopener noreferrer" class="footer-contact">+92 311 7732344</a>
      </div>
    </div>
  </footer>

  <script src="js/particles.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
